<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Калькулятор</title>
<style>
  :root {
    --bg: #0f1117;
    --display: #1a1d27;
    --btn: #232734;
    --btn-hover: #2e3444;
    --accent: #4f8cff;
    --accent-hover: #3b74e0;
    --text: #e8eaf0;
    --muted: #8a91a5;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: radial-gradient(circle at 50% 0%, #1b2030, var(--bg) 70%);
    font-family: "Segoe UI", system-ui, sans-serif;
    padding: 16px;
  }

  .calc {
    width: 340px;
    background: var(--display);
    border-radius: 24px;
    padding: 20px;
    box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
  }

  .screen {
    background: var(--bg);
    border-radius: 16px;
    padding: 18px 16px;
    text-align: right;
    margin-bottom: 16px;
    min-height: 92px;
    display: flex;
    flex-direction: column;
    justify-content: flex-end;
  }

  .expr {
    color: var(--muted);
    font-size: 15px;
    min-height: 20px;
    word-break: break-all;
  }

  .result {
    color: var(--text);
    font-size: 34px;
    font-weight: 600;
    word-break: break-all;
    line-height: 1.2;
  }

  .grid {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 10px;
  }

  button {
    height: 60px;
    border: none;
    border-radius: 14px;
    font-size: 20px;
    color: var(--text);
    background: var(--btn);
    cursor: pointer;
    transition: background 0.15s, transform 0.05s;
  }

  button:hover { background: var(--btn-hover); }
  button:active { transform: scale(0.96); }

  button.op { background: #2b3452; }
  button.op:hover { background: #354061; }

  button.eq { background: var(--accent); grid-column: span 2; }
  button.eq:hover { background: var(--accent-hover); }

  button.fn { color: var(--muted); }
  button.fn:hover { background: var(--btn-hover); }
</style>
</head>
<body>
  <div class="calc">
    <div class="screen">
      <div class="expr" id="expr">&nbsp;</div>
      <div class="result" id="result">0</div>
    </div>
    <div class="grid">
      <button class="fn" data-k="C">C</button>
      <button class="fn" data-k="back">⌫</button>
      <button class="fn" data-k="%">%</button>
      <button class="op" data-k="/">÷</button>

      <button data-k="7">7</button>
      <button data-k="8">8</button>
      <button data-k="9">9</button>
      <button class="op" data-k="*">×</button>

      <button data-k="4">4</button>
      <button data-k="5">5</button>
      <button data-k="6">6</button>
      <button class="op" data-k="-">−</button>

      <button data-k="1">1</button>
      <button data-k="2">2</button>
      <button data-k="3">3</button>
      <button class="op" data-k="+">+</button>

      <button data-k="0">0</button>
      <button data-k=".">.</button>
      <button class="eq" data-k="=">=</button>
    </div>
  </div>

<script>
  const exprEl = document.getElementById("expr");
  const resultEl = document.getElementById("result");

  const SYMBOLS = { "+": "+", "-": "−", "*": "×", "/": "÷", "%": "%" };

  let display = "0";        // то, что набрано/показано сейчас
  let first = null;         // первый операнд (число)
  let operator = null;      // текущий оператор
  let waitingSecond = false;// ждём второй операнд
  let lastOp = null;        // для повторного "="
  let lastSecond = null;    // для повторного "="
  let justEvaluated = false;

  function fmt(n) {
    if (!isFinite(n)) return "Ошибка";
    if (Number.isInteger(n) && Math.abs(n) < 1e15) return String(n);
    // убираем хвосты плавающей точки
    let s = String(parseFloat(n.toPrecision(12)));
    if (Math.abs(n) >= 1e15) s = n.toExponential(6);
    return s;
  }

  function render() {
    resultEl.textContent = display;
  }

  function showExpr(text) {
    exprEl.textContent = text || "\u00a0";
  }

  function reset() {
    display = "0";
    first = null;
    operator = null;
    waitingSecond = false;
    lastOp = null;
    lastSecond = null;
    justEvaluated = false;
    showExpr("");
    render();
  }

  function inputDigit(d) {
    if (justEvaluated) {           // после "=" новое число начинает новое выражение
      reset();
    }
    if (waitingSecond) {
      display = d;
      waitingSecond = false;
    } else {
      display = display === "0" ? d : display + d;
    }
    render();
  }

  function inputDot() {
    if (justEvaluated) {
      reset();
    }
    if (waitingSecond) {
      display = "0.";
      waitingSecond = false;
      render();
      return;
    }
    if (!display.includes(".")) display += ".";
    render();
  }

  function inputOperator(nextOp) {
    justEvaluated = false;
    const value = parseFloat(display);

    // нажали оператор, ещё не набрав второй операнд — просто меняем оператор
    if (operator && waitingSecond) {
      operator = nextOp;
      showExpr(fmt(first) + " " + SYMBOLS[nextOp]);
      return;
    }

    if (first === null) {
      first = value;
    } else if (operator) {
      const result = compute(first, value, operator);
      if (result === null) return;       // ошибка уже показана
      first = result;
      display = fmt(result);
    }

    operator = nextOp;
    waitingSecond = true;
    showExpr(fmt(first) + " " + SYMBOLS[nextOp]);
    render();
  }

  function compute(a, b, op) {
    let result;
    switch (op) {
      case "+": result = a + b; break;
      case "-": result = a - b; break;
      case "*": result = a * b; break;
      case "/":
        if (b === 0) { showError(); return null; }
        result = a / b;
        break;
      case "%":
        if (b === 0) { showError(); return null; }
        result = a % b;
        break;
      default: return b;
    }
    return result;
  }

  function inputPercent() {
    // процент от операнда: 200 + 10% => 220
    let value = parseFloat(display);
    if (first !== null && operator) {
      value = first * value / 100;
    } else {
      value = value / 100;
    }
    display = fmt(value);
    render();
  }

  function inputEquals() {
    const value = parseFloat(display);

    if (operator && !waitingSecond) {
      // обычное "="
      const op = operator;
      const a = first;
      const b = value;
      const result = compute(a, b, op);
      if (result === null) return;
      showExpr(fmt(a) + " " + SYMBOLS[op] + " " + fmt(b) + " =");
      display = fmt(result);
      first = result;
      lastOp = op;
      lastSecond = b;
      operator = null;
      waitingSecond = true;
      justEvaluated = true;
      render();
    } else if (lastOp !== null && lastSecond !== null) {
      // повторное "=": применяем последнюю операцию ещё раз
      const result = compute(first, lastSecond, lastOp);
      if (result === null) return;
      showExpr(fmt(first) + " " + SYMBOLS[lastOp] + " " + fmt(lastSecond) + " =");
      display = fmt(result);
      first = result;
      justEvaluated = true;
      render();
    } else {
      showExpr(fmt(value) + " =");
      display = fmt(value);
      first = value;
      justEvaluated = true;
      render();
    }
  }

  function showError() {
    display = "Ошибка";
    showExpr("");
    first = null;
    operator = null;
    waitingSecond = true;
    justEvaluated = true;
    render();
  }

  function inputBackspace() {
    if (waitingSecond || justEvaluated) return;
    display = display.length > 1 ? display.slice(0, -1) : "0";
    render();
  }

  function handle(key) {
    if ("0123456789".includes(key)) return inputDigit(key);
    if (key === ".") return inputDot();
    if ("+-*/".includes(key)) return inputOperator(key);
    if (key === "%") return inputPercent();
    if (key === "=") return inputEquals();
    if (key === "back") return inputBackspace();
    if (key === "C") return reset();
  }

  document.querySelectorAll("button").forEach((btn) => {
    btn.addEventListener("click", () => handle(btn.dataset.k));
  });

  document.addEventListener("keydown", (e) => {
    const map = { "Enter": "=", "=": "=", "Backspace": "back", "Escape": "C", ",": "." };
    const key = map[e.key] ?? e.key;
    if ("0123456789.+-*/%".includes(key) || ["=", "back", "C"].includes(key)) {
      e.preventDefault();
      handle(key);
    }
  });

  reset();
</script>
</body>
</html>
